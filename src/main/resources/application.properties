spring.application.name=tours-and-travels

# Web configuration
server.servlet.context-path=/tours-travels-app
server.port=8484

# Datasource and JPA Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tours_and_travels
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging level
logging.level.in.shivamvyas.toursandtravels=DEBUG

# JWT (secret comes from the environment, at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# CORS: comma-separated list of allowed front-end origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Optional first admin, created at startup only if both are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
