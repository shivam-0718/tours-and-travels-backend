spring.application.name=tours-and-travels

# Web configuration
server.servlet.context-path=/tours-travels-app
server.port=8484

# Datasource and JPA Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tours_and_travels
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging level
logging.level.in.shivamvyas.toursandtravels=DEBUG